FSEEK:
  calls:
    - ZXNCALLS
    - ZXNWORK
  code: |
    ; HL = file handle, DE = bytes to seek address, BC = mode
    PUSH IX

    EX DE,HL
    PUSH BC
    POP IX

    LD A,E
    ; HL = bytes to seek address
    LD E,(HL)
    INC HL
    LD D,(HL)
    INC HL
    LD C,(HL)
    INC HL
    LD B,(HL)

    EXX
    RST $08
    DB $9F  ; F_SEEK

    EX DE,HL
    LD E,C
    LD D,B

    POP IX
    RET

FSTAT:
  calls:
    - ZXNCALLS
    - ZXNWORK
  code: |
    ; HL = file handle, DE = stat address
    PUSH IX

    LD A,L
    PUSH DE
    POP IX

    EXX
    RST $08
    DB $A1  ; F_STAT

    POP IX
    RET

FREAD:
  calls:
    - ZXNCALLS
    - ZXNWORK
  code: |
    ; HL = file handle, DE = address, BC = size
    PUSH IX
    LD A,L
    PUSH DE
    POP IX

    EXX
    RST $08
    DB $9D    ; F_READ

    POP IX;
    RET


FWRITE:
  calls:
    - ZXNCALLS
    - ZXNWORK
  code: |
    ; HL = file handle, DE = address, BC = size
    PUSH IX
    LD A,L
    PUSH DE
    POP IX

    EXX
    RST $08
    DB $9E    ; F_WRITE

    POP IX;
    RET


