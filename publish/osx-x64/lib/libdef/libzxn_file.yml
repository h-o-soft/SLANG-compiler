



FOPEN:
  calls:
    - ZXNCALLS
    - ZXNWORK
  code: |
    ; HL = fname addr, DE = mode
    PUSH IX

    LD A,'*'
    PUSH HL
    POP IX
    LD B,E

    LD DE,FHEADER

